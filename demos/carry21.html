function layout() {
  const pad = 14, wide = W >= 900, gap = 10;
  const o = { pad, wide };
  if (wide) {
    const ph = Math.min(140, H * 0.31), py = H - pad - 22 - ph;
    o.scene = { x: 0, y: 0, w: W, h: H - 6 };
    const wt = Math.min(230, W * 0.2), we = Math.min(290, W * 0.24);
    const wm = (W - pad * 2 - wt - we - gap * 3) / 2;
    o.top = { x: pad, y: py, w: wt, h: ph };
    o.vf = { x: pad + wt + gap, y: py, w: wm, h: ph };
    o.vs = { x: pad + wt + gap * 2 + wm, y: py, w: wm, h: ph };
    o.eq = { x: W - pad - we, y: py, w: we, h: ph };
  } else {
    o.scene = { x: 0, y: 0, w: W, h: H * 0.5 };
    const by = H * 0.47, bh = (H - by - pad * 2 - 18 - gap) / 2, half = (W - pad * 2 - gap) / 2;
    o.top = { x: pad, y: by, w: half, h: bh };
    o.eq = { x: pad + half + gap, y: by, w: half, h: bh };
    o.vf = { x: pad, y: by + bh + gap, w: half, h: bh };
    o.vs = { x: pad + half + gap, y: by + bh + gap, w: half, h: bh };

  o.cx = o.scene.w / 2; o.cy = wide ? 62 + (H - 62 - 178) * 0.36 : 56 + (o.scene.h - 56) * 0.40;

}

let yaw = 0, pitch = 0.5;
const ZC = 6, DIST = 44;
function P(x, y, z) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const zz = z - ZC;
  const X = x * cy + zz * sy, Z1 = -x * sy + zz * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const Y = y * cp + Z1 * sp, Z = -y * sp + Z1 * cp;
  const s = L.F / (DIST + Z);
  return { x: L.cx + X * s, y: L.cy - Y * s - 0, s, d: Z };
}

const ease = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

  ctx.fillStyle = rgb(VC.f, 1); ctx.fillText(nm('2.1') + f.toFixed(1) + '% vol' + sz(f), b.x + 10, yy - 12);
  ctx.fillStyle = rgb(VC.a, 1); ctx.fillText(nm('1.3') + a.toFixed(1) + '% vol' + sz(a), b.x + 10, yy);
}
let VS = { s: null };
function drawVolScore() {
  const b = L.vs, wf = weekAt(T), s0 = wf >= 0 ? vscore(0, Math.floor(wf) - VLAG) : null, wi = Math.floor(wf);
  if (s0) { const k = Math.min(1, FDT * 4); VS.s = VS.s ? Object.fromEntries(Object.keys(s0).map(q => [q, VS.s[q] + (s0[q] - VS.s[q]) * k])) : { ...s0 }; } else VS.s = null;
  const s = VS.s ? { ...VS.s, n: s0.n } : null;
  panel(b, L.wide ? 'VOL FORECAST SCORE' : 'FORECAST SCORE', s && b.w > 220 ? s.n.toLocaleString() + ' scored' : '');
  if (!s) { vempty(b); return; }
  // lay the content out over the whole box: headline, miss bars, footnote
  const x = b.x + 10, ww = b.w - 20, top = b.y + 24, bot = b.y + b.h - 8, avail = bot - top;
  const big = (s.skill >= 0 ? '+' : '') + (s.skill * 100).toFixed(0) + '%';
  const bigFs = Math.max(16, Math.min(26, avail * 0.2));
  const bh = Math.max(7, Math.min(14, avail * 0.09)), gap = Math.max(6, Math.min(14, avail * 0.07)), footH = 14;
  const barsH = 12 + gap + 2 * bh + gap;   // section label + two bars
  const free = Math.max(0, avail - bigFs - barsH - footH);
  const yBig = top + free * 0.22 + bigFs;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${bigFs}px ${MONO}`; ctx.fillStyle = s.skill >= 0 ? VC.good : VC.bad;
  ctx.fillText(big, x, yBig);
  const tx = x + ctx.measureText(big).width + 12, sfs = Math.max(9.5, Math.min(12, avail * 0.085));
  ctx.font = `400 ${sfs}px ${SANS}`; ctx.fillStyle = C.dim;
  ctx.fillText(b.w > 220 ? 'lower forecast loss (QLIKE)' : 'lower loss', tx, yBig - bigFs * 0.52);
  ctx.fillText((b.w > 220 ? 'closer to actual ' : 'closer ') + (s.closer * 100).toFixed(0) + '%' + (b.w > 220 ? ' of weeks' : ''), tx, yBig);
  // miss vs the 15% risk target
  const hw = VD.d.findIndex(d => d >= HOLD), wr = wi - VLAG, held = wr >= hw ? vscore(hw, wr) : null;
  const yHead = yBig + free * 0.42 + 12;
  ctx.font = `600 ${Math.max(8, Math.min(10, avail * 0.07))}px ${MONO}`; ctx.fillStyle = C.faint;
  ctx.fillText(b.w > 220 ? 'AVG MISS VS 15% RISK TARGET, VOL PTS' : 'MISS VS 15% TARGET', x, yHead);
  const maxv = Math.max(s.ma, s.mf) * 1.2, lfs = Math.max(9, Math.min(11, avail * 0.08));
  ctx.font = `500 ${lfs}px ${MONO}`;
  const labs = [b.w > 200 ? 'Trend + Carry 2.1' : 'T+C 2.1', b.w > 200 ? 'Trend + Carry 1.3' : 'T+C 1.3'];
  const lw = Math.max(...labs.map(l => ctx.measureText(l).width)) + 12, vw = 34;
  [[labs[0], s.mf, VC.f], [labs[1], s.ma, VC.a]].forEach(([lab, val, col], k) => {
    const y = yHead + gap + k * (bh + gap);
    rr(x + lw, y, ww - lw - vw, bh, 2); ctx.fillStyle = 'rgba(120,140,170,0.10)'; ctx.fill();
    rr(x + lw, y, Math.max(2, (ww - lw - vw) * val / maxv), bh, 2); ctx.fillStyle = rgb(col, 0.85); ctx.fill();
    ctx.font = `500 ${lfs}px ${MONO}`; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.dim; ctx.textAlign = 'left'; ctx.fillText(lab, x, y + bh / 2);
    ctx.fillStyle = C.txt; ctx.textAlign = 'right'; ctx.fillText(val.toFixed(1), x + ww, y + bh / 2);
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  });
  ctx.font = `400 ${Math.max(9, Math.min(10.5, avail * 0.075))}px ${SANS}`; ctx.fillStyle = C.faint;
  const note = held ? 'Held-back weeks only: ' + (held.skill >= 0 ? '+' : '') + (held.skill * 100).toFixed(0) + '%'
                    : (b.w > 220 ? 'Out-of-sample forecasts, weekly samples' : 'Out-of-sample, weekly');
  ctx.fillText(note, x, bot);
}

function drawFooter() {
  ctx.textBaseline = 'alphabetic'; ctx.font = `500 9.5px ${MONO}`; ctx.fillStyle = C.faint;
  const y = H - 10;
  ctx.textAlign = 'left';
  let x = L.pad;
  const item = (c, s) => { ctx.fillStyle = rgb(c, 1); ctx.fillRect(x, y - 7, 9, 8); x += 13; ctx.fillStyle = C.faint; ctx.fillText(s, x, y); x += ctx.measureText(s).width + 12; };
  item(C.long, 'long'); item(C.short, 'short');
  ctx.textAlign = 'right';
  ctx.fillText(L.wide ? 'bar height = share of the book’s risk · labels = % of NAV · real backtest positions' : 'real backtest positions', W - L.pad, y);
}

// ── loop ──
let last = performance.now();
function paint(now) {
  const tt = now / 1000;
  yaw = -0.16 + Math.sin(tt * 0.12) * 0.13;
  pitch = (L.wide ? 0.42 : 0.5) + Math.sin(tt * 0.09) * 0.04;
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 10, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#0b1220'); g.addColorStop(1, C.bg); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawScene(); drawHeader(); drawTop(); drawVolFocus(); drawVolScore(); drawEquity(); drawFooter();
  if (hold > 2.6) { ctx.fillStyle = `rgba(5,8,13,${Math.min(1, (hold - 2.6) / 1.4)})`; ctx.fillRect(0, 0, W, H); }
}
function frame(now) {
  requestAnimationFrame(frame);   // queue the next frame first, so one bad frame can't stop the loop
  // the first rAF timestamp can be earlier than the performance.now() taken when the script ran;
  // a negative step pushed T below 0, paint() read month -1 and threw, and the loop died
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
  if (!document.hidden) {
    FDT = dt;
    SPEED += (speedAt(T + 0.9) - SPEED) * Math.min(1, dt * 1.8);   // look ahead so it brakes before an event
    if (T < NM - 1) T = Math.max(0, Math.min(NM - 1, T + dt * SPEED));
    else { hold += dt; if (hold > 4) { hold = 0; T = START; SPEED = BASE_SPEED; } }
    paint(now);
  }
}
(function () { const q = new URLSearchParams(location.search).get('m'); const i = q ? D.m.indexOf(q) : -1; if (i >= 0) T = i; })();
resize(); paint(performance.now());   // first frame draws even in a hidden tab or a preview
requestAnimationFrame(frame);
</script>
