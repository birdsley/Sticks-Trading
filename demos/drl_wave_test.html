<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRL Vol — Implied Volatility Surface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07070f; overflow: hidden; font-family: -apple-system,BlinkMacSystemFont,sans-serif; }
  canvas { display: block; }
  #regime-badge { position: absolute; top: 12px; left: 14px; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 5px; pointer-events: none; transition: all 0.5s; }
  #vol-target { position: absolute; top: 12px; right: 60px; font-size: 11px; pointer-events: none; text-align: right; line-height: 1.7; }
  #colorbar { position: absolute; top: 12px; right: 12px; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #cb-label { font-size: 9.5px; color: #6a6a78; }
  #cb-canvas { width: 12px; height: 100px; border-radius: 2px; }
  #alloc-panel { position: absolute; bottom: 12px; right: 12px; pointer-events: none; font-size: 10.5px; width: 130px; }
  .ar { display:flex; align-items:center; gap:5px; margin-bottom:4px; }
  .ar-label { width:32px; text-align:right; flex-shrink:0; }
  .ar-bg { flex:1; height:4px; background:#131320; border-radius:2px; overflow:hidden; }
  .ar-fill { height:100%; border-radius:2px; transition: width 0.65s ease; }
  #hud { position: absolute; bottom: 12px; left: 14px; font-family: 'SF Mono','JetBrains Mono',monospace; font-size: 10.5px; color: rgba(160,120,255,0.55); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="regime-badge">—</div>
<div id="vol-target">
  <div style="font-size:9.5px;color:#6a6a78;text-transform:uppercase;letter-spacing:0.8px;">Portfolio IV</div>
  <div id="ptf-vol" style="font-size:16px;font-weight:700;color:#a08eff;">—</div>
  <div style="font-size:9.5px;color:#6a6a78;">Target: 12%</div>
</div>
<div id="colorbar"><div id="cb-label">IV %</div><canvas id="cb-canvas" width="12" height="100"></canvas></div>
<div id="alloc-panel"></div>
<div id="hud">Implied volatility surface · 9-ETF universe · targeting 12% portfolio IV</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── High-DPI / Retina backing — sharp geometry on 2K/4K ───────
let DPR = Math.max(1, window.devicePixelRatio || 1);
let VW = 0, VH = 0;                       // logical (CSS) px
function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width  = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width  = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // 1 unit = 1 CSS px
}
resize(); window.addEventListener('resize', resize);

// ── Grid: higher definition ───────────────────────────────────
const GX = 30, GY = 22;   // increased from 26×18
const MN_MIN = 0.68, MN_MAX = 1.32;
const EXP_MIN = 5, EXP_MAX = 155;
const MARGIN = 18;
const SHIFT  = 38;   // lift grid up in the iframe frame

const GZ_SCALE = 5.0;
const VOL_MAX  = 2.2;
const GZ_MAX   = VOL_MAX * GZ_SCALE;

function dims() {
  const w = VW, h = VH;
  const cwH = (h - 2*MARGIN) / ((GX+GY)*0.46 + GZ_MAX*0.50);
  const cwW = w / (GX+GY+2);
  const cw  = Math.max(3, Math.floor(Math.min(cwH, cwW)));
  const ch  = Math.floor(cw*0.46);
  const cz  = cw*0.50;
  const oy  = h - MARGIN - (GX+GY)*ch - SHIFT;
  return { cw, ch, cz, ox: w*0.5, oy };
}
function iso(gx, gy, gz) {
  const { cw, ch, cz, ox, oy } = dims();
  return [ox+(gx-gy)*cw, oy+(gx+gy)*ch-gz*cz];
}

// ── Vol surface with visible breathing ────────────────────────
let t = 0, volScale = 1.0;

function getVol(gx, gy) {
  const k  = MN_MIN + (gx/GX)*(MN_MAX-MN_MIN);
  const T  = EXP_MIN + (gy/GY)*(EXP_MAX-EXP_MIN);
  const Ty = T/252;
  const sqT= Math.sqrt(Math.max(0.005, Ty));
  const nx = gx/GX, ny = gy/GY;

  // ── Volatility surface with strong relief across the whole grid ──
  // Both wings rise (full smile), term structure undulates, and the
  // skew steepens at the long end → no flat plateau.
  const base      = 0.16;
  const putSkew   = Math.max(0, (1.06-k))*0.98/sqT;              // deep ITM-put wing
  const callSmile = Math.pow(Math.max(0, k-0.99), 1.45)*0.72;   // call wing (smile)
  const termWave  = 0.075*Math.sin(ny*Math.PI*1.7 + 0.35)       // contango/backwardation humps
                  + 0.040*Math.sin(ny*Math.PI*3.3 + 1.1);
  const termPrem  = 0.050/sqT;
  const skewTilt  = Math.max(0,(1.0-k))*ny*0.42;                 // skew deepens with maturity

  // Breathing: multi-frequency rolling waves, amplified for visible relief
  const breathe = (
    Math.sin(nx*Math.PI*2.4 + t*0.011)*0.11 +
    Math.sin(ny*Math.PI*1.9 + t*0.009)*0.09 +
    Math.sin((nx-ny)*Math.PI*1.6 + t*0.007)*0.075 +
    Math.sin((nx*2.1+ny*1.3)*Math.PI + t*0.013)*0.055 +
    Math.sin((nx+ny)*Math.PI*1.2 + t*0.005)*0.045
  ) * volScale;

  return Math.min(VOL_MAX, Math.max(0.02,
    base + putSkew + callSmile + termWave + termPrem + skewTilt + breathe));
}

// Build entire grid each frame (colors automatically reflect elevation)
function buildVol() {
  const V=[];
  for (let gy=0;gy<=GY;gy++) { V[gy]=[]; for (let gx=0;gx<=GX;gx++) V[gy][gx]=getVol(gx,gy); }
  return V;
}

// ── Color: blue→green→yellow→orange→red ──────────────────────
function volColor(v) {
  const n = Math.min(1, v/VOL_MAX);
  const stops = [
    {t:0.00,r:55,g:15,b:210},{t:0.09,r:25,g:85,b:255},
    {t:0.20,r:0,g:195,b:125},{t:0.38,r:175,g:200,b:0},
    {t:0.62,r:255,g:125,b:0},{t:1.00,r:255,g:18,b:28},
  ];
  let i=0; while(i<stops.length-2&&n>stops[i+1].t) i++;
  const s1=stops[i],s2=stops[i+1];
  const f=Math.min(1,(n-s1.t)/Math.max(0.001,s2.t-s1.t));
  return [Math.round(s1.r+(s2.r-s1.r)*f),Math.round(s1.g+(s2.g-s1.g)*f),Math.round(s1.b+(s2.b-s1.b)*f)];
}

// ── ETFs ─────────────────────────────────────────────────────
const ETF_BASE_IV = [0.183,0.205,0.075,0.145,0.248,0.195,0.082,0.148,0.032];
const ETFS = [
  {n:'SPY', c:'#00d4aa',k:1.00,T:30 }, {n:'EFA', c:'#00a8ff',k:0.97,T:45 },
  {n:'IEF', c:'#7c3aed',k:1.00,T:90 }, {n:'GLD', c:'#f59e0b',k:0.98,T:30 },
  {n:'VNQ', c:'#ec4899',k:0.93,T:20 }, {n:'DBC', c:'#10b981',k:0.95,T:35 },
  {n:'TIP', c:'#6366f1',k:1.00,T:120}, {n:'DBMF',c:'#f97316',k:1.00,T:30 },
  {n:'SHY', c:'#94a3b8',k:1.00,T:150},
];

const etfPos = ETFS.map(e=>({ k:e.k, T:e.T, dK:(Math.random()-.5)*0.0003, dT:(Math.random()-.5)*0.14 }));

function etfToGrid(k,T) {
  return [
    Math.max(0,Math.min(GX,Math.round((k-MN_MIN)/(MN_MAX-MN_MIN)*GX))),
    Math.max(0,Math.min(GY,Math.round((T-EXP_MIN)/(EXP_MAX-EXP_MIN)*GY))),
  ];
}

// ── Regimes ───────────────────────────────────────────────────
const REGIMES = [
  {name:'Bull — Low Vol',          color:'#00d4aa',vScale:0.82,w:[0.30,0.18,0.04,0.07,0.09,0.07,0.04,0.12,0.09]},
  {name:'Stressed — Elevated Vol', color:'#ff9f43',vScale:1.18,w:[0.14,0.10,0.18,0.14,0.05,0.08,0.13,0.10,0.08]},
  {name:'Crisis — Capital Pres.',  color:'#ff4757',vScale:1.48,w:[0.04,0.04,0.26,0.16,0.02,0.04,0.16,0.08,0.20]},
];
let regIdx=0, regTimer=200;
let curW=[...REGIMES[0].w];

function updateRegime() {
  if(--regTimer<=0){
    regIdx=(regIdx+1)%REGIMES.length; regTimer=175+Math.floor(Math.random()*100);
    const r=REGIMES[regIdx];
    const b=document.getElementById('regime-badge');
    b.textContent='● '+r.name; b.style.background=r.color+'1a'; b.style.color=r.color; b.style.border=`1px solid ${r.color}44`;
  }
  const tw=REGIMES[regIdx].w;
  for(let i=0;i<9;i++) curW[i]+=(tw[i]-curW[i])*0.03;
  volScale+=(REGIMES[regIdx].vScale-volScale)*0.018;
}

// ── DRL vol-target controller ─────────────────────────────────────
// Maps the live ETF weighting onto the surface: reads each ETF's local
// implied vol off the surface, then sizes gross exposure (g) so the
// realized portfolio IV tracks the 12% target. Surplus is parked in
// cash (SHY). effW are the post-targeting weights shown on the bars.
const VOL_TARGET = 0.12;
const CASH_IDX = 8;            // SHY
const REF_VOL  = 0.30;        // surface level that maps to each ETF's base vol
let drlG = 1.0;               // EMA-smoothed gross-exposure scaler
let effW = [...curW];
function applyVolTarget(V) {
  // Each ETF's realized vol = its base vol scaled by the LIVE surface
  // elevation under its marker → weighting is mapped onto the surface,
  // but magnitudes stay realistic (3–25%) so a 12% target is reachable.
  const lv = ETFS.map((_,i)=>{
    const [gx,gy]=etfToGrid(etfPos[i].k, etfPos[i].T);
    const surf = V[Math.min(GY,gy)][Math.min(GX,gx)];
    return ETF_BASE_IV[i] * (surf / REF_VOL);
  });
  // risky vol if fully invested at regime weights (cash excluded from risk)
  let riskyVol=0, riskySum=0;
  for(let i=0;i<9;i++) if(i!==CASH_IDX){ riskyVol+=curW[i]*lv[i]; riskySum+=curW[i]; }
  const grossVol = riskyVol || 1e-6;
  // gross scaler to hit target, clamped to a sane band
  const gTarget = Math.max(0.35, Math.min(1.25, VOL_TARGET/grossVol));
  drlG += (gTarget-drlG)*0.05;

  // post-targeting weights: scale risky sleeve by g, park remainder in cash
  let riskyAlloc=0;
  for(let i=0;i<9;i++){ if(i!==CASH_IDX){ effW[i]=curW[i]*drlG; riskyAlloc+=effW[i]; } }
  effW[CASH_IDX]=Math.max(0, 1-riskyAlloc);

  // realized portfolio IV after targeting
  let ptfVol=0; for(let i=0;i<9;i++) ptfVol+=effW[i]*lv[i];

  const pEl=document.getElementById('ptf-vol');
  if(pEl){ pEl.textContent=(ptfVol*100).toFixed(1)+'%'; const d=ptfVol*100-12;
    pEl.style.color=Math.abs(d)<2?'#00d4aa':d>0?'#ff9f43':'#a08eff'; }
  ETFS.forEach((_,i)=>{ const bar=document.getElementById('abar-'+i);
    if(bar) bar.style.width=(effW[i]*100).toFixed(1)+'%'; });
}

function updateEtfPos() {
  etfPos.forEach((p,i)=>{
    p.k+=(ETFS[i].k+(curW[i]-0.11)*0.35-p.k)*0.006+p.dK*0.4;
    p.T+=(ETFS[i].T-p.T)*0.005+p.dT*0.4;
    p.k=Math.max(MN_MIN+0.02,Math.min(MN_MAX-0.02,p.k));
    p.T=Math.max(EXP_MIN+2,Math.min(EXP_MAX-2,p.T));
    if(Math.random()<0.004) p.dK=(Math.random()-.5)*0.0005;
    if(Math.random()<0.004) p.dT=(Math.random()-.5)*0.22;
  });
}

// Build DOM
(function(){
  const panel=document.getElementById('alloc-panel');
  ETFS.forEach((e,i)=>{
    const row=document.createElement('div'); row.className='ar';
    row.innerHTML=`<span class="ar-label" style="color:${e.c}88">${e.n}</span><div class="ar-bg"><div class="ar-fill" id="abar-${i}" style="width:${(curW[i]*100).toFixed(1)}%;background:${e.c};"></div></div>`;
    panel.appendChild(row);
  });
})();

(function(){
  const cb=document.getElementById('cb-canvas'), cctx=cb.getContext('2d');
  const g=cctx.createLinearGradient(0,0,0,100);
  g.addColorStop(0,'#ff121c'); g.addColorStop(0.28,'#ff8000'); g.addColorStop(0.48,'#c8c800');
  g.addColorStop(0.68,'#00c880'); g.addColorStop(0.88,'#1850ff'); g.addColorStop(1,'#3010c8');
  cctx.fillStyle=g; cctx.fillRect(0,0,12,100);
})();

const r0=REGIMES[0], badge=document.getElementById('regime-badge');
badge.textContent='● '+r0.name; badge.style.background=r0.color+'1a'; badge.style.color=r0.color; badge.style.border=`1px solid ${r0.color}44`;

function sphere(x,y,r,hex,a) {
  if(r<1.5) return;
  // tight, low-intensity rim glow only — no large cloud obscuring labels
  const glow=ctx.createRadialGradient(x,y,r*0.85,x,y,r*1.25);
  glow.addColorStop(0,hex+Math.round(a*34).toString(16).padStart(2,'0')); glow.addColorStop(1,hex+'00');
  ctx.beginPath(); ctx.arc(x,y,r*1.25,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
  const sg=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.05,x+r*.08,y+r*.08,r);
  sg.addColorStop(0,'rgba(255,255,255,'+(a*.78)+')');
  sg.addColorStop(.3,hex+Math.round(a*220).toString(16).padStart(2,'0'));
  sg.addColorStop(1,hex+Math.round(a*120).toString(16).padStart(2,'0'));
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
}

function frame() {
  t++;
  updateRegime();
  updateEtfPos();
  const V = buildVol();  // recomputed every frame — colors track elevation automatically
  applyVolTarget(V);     // DRL sizes weights off the live surface → 12% target

  const w=VW, h=VH;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#06060e'; ctx.fillRect(0,0,w,h);

  // Surface — diagonal sweep, colors auto-track live elevation
  for (let d=0;d<=GX+GY-2;d++) {
    for (let gx=0;gx<=d&&gx<GX;gx++) {
      const gy=d-gx; if(gy<0||gy>=GY) continue;
      const v00=V[gy][gx],v10=V[gy][gx+1],v01=V[gy+1][gx],v11=V[gy+1][gx+1];
      const avg=(v00+v10+v01+v11)/4;
      const gz00=Math.min(v00,VOL_MAX)*GZ_SCALE, gz10=Math.min(v10,VOL_MAX)*GZ_SCALE;
      const gz01=Math.min(v01,VOL_MAX)*GZ_SCALE, gz11=Math.min(v11,VOL_MAX)*GZ_SCALE;
      const [x00,y00]=iso(gx,gy,gz00),     [x10,y10]=iso(gx+1,gy,gz10);
      const [x11,y11]=iso(gx+1,gy+1,gz11), [x01,y01]=iso(gx,gy+1,gz01);
      const [r,g,b]=volColor(avg);
      ctx.beginPath(); ctx.moveTo(x00,y00); ctx.lineTo(x10,y10); ctx.lineTo(x11,y11); ctx.lineTo(x01,y01); ctx.closePath();
      ctx.fillStyle=`rgba(${r},${g},${b},0.93)`; ctx.fill();
      ctx.strokeStyle=`rgba(${Math.min(255,r+16)},${Math.min(255,g+16)},${Math.min(255,b+16)},0.28)`;
      ctx.lineWidth=0.3; ctx.stroke();
    }
  }

  // ETF pins
  ETFS.forEach((etf,i)=>{
    const [gx,gy]=etfToGrid(etfPos[i].k,etfPos[i].T);
    const vol=V[Math.min(GY,gy)][Math.min(GX,gx)];
    const gz=Math.min(vol,VOL_MAX)*GZ_SCALE;
    const [sx,sy]=iso(gx+.5,gy+.5,gz);
    const wt=effW[i];                       // post-targeting weight drives pin size
    const pinR=Math.max(3.5, Math.min(14, wt*40));   // capped so labels stay legible
    const {cz}=dims();
    const gzStem=gz+( pinR*1.8+10)/cz;
    const [tx,ty]=iso(gx+.5,gy+.5,gzStem);
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(tx,ty);
    ctx.strokeStyle=etf.c+'99'; ctx.lineWidth=1.4; ctx.stroke();
    sphere(tx,ty,pinR,etf.c,Math.min(1,wt*9.5));
    if(wt>0.035){
      // place label clear of the sphere; dark halo keeps it readable over bright surface
      const isLeft=gx<GX*.5; ctx.textAlign=isLeft?'left':'right';
      const lx=isLeft?tx+pinR+6:tx-pinR-6;
      ctx.lineWidth=2.6; ctx.strokeStyle='rgba(6,6,14,0.85)'; ctx.lineJoin='round';
      ctx.font=`${wt>0.12?'bold ':''}10.5px -apple-system,sans-serif`;
      ctx.strokeText(etf.n,lx,ty-3); ctx.fillStyle=etf.c+'ee'; ctx.fillText(etf.n,lx,ty-3);
      ctx.font='9px "SF Mono",monospace';
      ctx.lineWidth=2.4; ctx.strokeText((wt*100).toFixed(0)+'%',lx,ty+8);
      ctx.fillStyle=etf.c+'cc'; ctx.fillText((wt*100).toFixed(0)+'%',lx,ty+8);
      ctx.textAlign='left';
    }
  });

  // Axis labels
  ctx.font='9.5px "SF Mono",monospace'; ctx.fillStyle='#222230'; ctx.textAlign='center';
  [0.75,0.90,1.00,1.10,1.20].forEach(k=>{
    const gx=(k-MN_MIN)/(MN_MAX-MN_MIN)*GX; const [x,y]=iso(gx,GY,0); ctx.fillText(k.toFixed(2),x,y+13);
  });
  [30,60,90,120,150].forEach(T=>{
    const gy=(T-EXP_MIN)/(EXP_MAX-EXP_MIN)*GY; const [x,y]=iso(GX,gy,0); ctx.fillText(T+'d',x+9,y+4);
  });
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle='#252535'; ctx.textAlign='center';
  const [mx,my]=iso(GX/2,GY+1.0,0); ctx.fillText('Moneyness (K/S)',mx,my);
  ctx.textAlign='left';

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
