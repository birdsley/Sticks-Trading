<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markowitz — Efficient Frontier</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0d12; overflow: hidden; }
  canvas { display: block; }
  #hud { position: absolute; bottom: 12px; left: 14px; font-family: 'SF Mono','JetBrains Mono',monospace; font-size: 10.5px; color: rgba(0,168,255,0.55); pointer-events: none; }
  #rebal-flash { position: absolute; top: 12px; right: 14px; font-family: -apple-system,BlinkMacSystemFont,sans-serif; font-size: 11px; color: #00a8ff; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">24-asset universe · Ledoit-Wolf shrinkage · max-Sharpe tangency · weekly rebalance</div>
<div id="rebal-flash">↻ Rebalancing</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   Markowitz — minimum-variance frontier + Capital Allocation Line
   Academic layout: risky-asset bullet, tangency portfolio, and the
   best-possible CAL from the risk-free rate. Real S&P 500 tickers
   sit at realistic (σ, E[r]) coordinates inside the bullet.
   ══════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

/* ── High-DPI / Retina backing ──────────────────────────────────── */
let DPR = Math.max(1, window.devicePixelRatio || 1);
let VW = 0, VH = 0;
function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width  = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width  = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize(); window.addEventListener('resize', resize);

/* ── Real tickers at realistic (risk σ, expected return) ─────────── */
const ALL_TICKERS = [
  { t:'KO',    r:0.118, ret:0.080 }, { t:'JNJ',   r:0.138, ret:0.088 },
  { t:'PG',    r:0.128, ret:0.093 }, { t:'MCD',   r:0.153, ret:0.116 },
  { t:'WMT',   r:0.145, ret:0.105 }, { t:'V',     r:0.182, ret:0.152 },
  { t:'JPM',   r:0.192, ret:0.142 }, { t:'UNH',   r:0.183, ret:0.158 },
  { t:'XOM',   r:0.218, ret:0.116 }, { t:'HD',    r:0.195, ret:0.162 },
  { t:'COST',  r:0.198, ret:0.182 }, { t:'MSFT',  r:0.218, ret:0.208 },
  { t:'AAPL',  r:0.240, ret:0.195 }, { t:'GOOGL', r:0.242, ret:0.172 },
  { t:'LLY',   r:0.252, ret:0.232 }, { t:'AMZN',  r:0.262, ret:0.163 },
  { t:'META',  r:0.280, ret:0.228 }, { t:'VRTX',  r:0.228, ret:0.185 },
  { t:'GRMN',  r:0.238, ret:0.145 }, { t:'DECK',  r:0.268, ret:0.198 },
  { t:'NVO',   r:0.255, ret:0.215 }, { t:'MPWR',  r:0.285, ret:0.248 },
  { t:'CRWD',  r:0.292, ret:0.212 }, { t:'AXON',  r:0.298, ret:0.265 },
];

const N_VISIBLE = 12;
let assets = [];
let rebalTimer = 0, flashOpacity = 0;

function initAssets() {
  const pool = ALL_TICKERS.slice().sort(()=>Math.random()-0.5);
  assets = pool.slice(0, N_VISIBLE).map(tk => ({
    t: tk.t,
    r:   tk.r   + (Math.random()-0.5)*0.010,
    ret: tk.ret + (Math.random()-0.5)*0.008,
    dr:  (Math.random()-0.5)*0.00007,
    dret:(Math.random()-0.5)*0.00006,
    alpha: 1, _fadingOut:false,
  }));
}
initAssets();

function doRebalance() {
  const pool = ALL_TICKERS.filter(a=>!assets.some(b=>b.t===a.t));
  if (!pool.length) return;
  const tk = pool[(Math.random()*pool.length)|0];
  const idx = (Math.random()*assets.length)|0;
  assets[idx]._fadingOut = true;
  assets[idx]._next = {
    t: tk.t, r: tk.r+(Math.random()-0.5)*0.010, ret: tk.ret+(Math.random()-0.5)*0.008,
    dr:(Math.random()-0.5)*0.00007, dret:(Math.random()-0.5)*0.00006, alpha:0, _fadingOut:false,
  };
  flashOpacity = 1;
}

/* ── Chart space ─────────────────────────────────────────────────── */
const RISK_MAX = 0.36, RET_MAX = 0.32;
function PAD() { return { l:64, r:58, t:30, b:48 }; }
function toScreen(r, ret) {
  const p=PAD(), pw=VW-p.l-p.r, ph=VH-p.t-p.b;
  return [p.l+(r/RISK_MAX)*pw, p.t+ph-(ret/RET_MAX)*ph];
}

/* ── Risk-free rate & minimum-variance frontier (sideways parabola) ─
   σ(y) = σ0 + curv·(y − y0)²  — opens to the right.
   Vertex (σ0, y0) is the global minimum-variance portfolio; the upper
   branch (y ≥ y0) is the efficient frontier. Parameters breathe slowly
   so the bullet is alive but always academically correct.           */
const RF = 0.045;
let t = 0;
let fp  = { s0:0.100, y0:0.110, curv:4.7 };
let fpt = { s0:0.100, y0:0.110, curv:4.7 };
let paramTimer = 0;
function updateFrontier() {
  if (++paramTimer >= 260) {
    paramTimer = 0;
    fpt.s0   = 0.092 + Math.random()*0.020;
    fpt.y0   = 0.100 + Math.random()*0.022;
    fpt.curv = 4.3   + Math.random()*0.9;
  }
  fp.s0   += (fpt.s0  -fp.s0  )*0.004;
  fp.y0   += (fpt.y0  -fp.y0  )*0.004;
  fp.curv += (fpt.curv-fp.curv)*0.004;
}
function sigmaOf(y) { return fp.s0 + fp.curv*(y-fp.y0)*(y-fp.y0); }

/* Tangency portfolio: point on the upper frontier that maximizes the
   Sharpe ratio (slope of the line from the risk-free rate).          */
function tangency() {
  let best=null, bestSh=-Infinity;
  for (let y=fp.y0; y<=0.295; y+=0.0015) {
    const s = sigmaOf(y);
    const sh = (y-RF)/s;
    if (sh>bestSh) { bestSh=sh; best={r:s, ret:y, sharpe:sh}; }
  }
  return best;
}

function frame() {
  t++;
  updateFrontier();

  const w=VW, h=VH, p=PAD(), pw=w-p.l-p.r, ph=h-p.t-p.b;
  ctx.clearRect(0,0,w,h);
  const bg=ctx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#0d1219'); bg.addColorStop(1,'#090d12');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);

  /* ── grid ── */
  ctx.setLineDash([1,5]); ctx.lineWidth=1;
  [0.06,0.12,0.18,0.24,0.30,0.36].forEach(r=>{ const [x]=toScreen(r,0);
    ctx.beginPath(); ctx.moveTo(x,p.t); ctx.lineTo(x,p.t+ph); ctx.strokeStyle='#141b23'; ctx.stroke(); });
  [0.05,0.10,0.15,0.20,0.25,0.30].forEach(ret=>{ const [,y]=toScreen(0,ret);
    ctx.beginPath(); ctx.moveTo(p.l,y); ctx.lineTo(p.l+pw,y); ctx.strokeStyle='#141b23'; ctx.stroke(); });
  ctx.setLineDash([]);

  const tan = tangency();

  /* ── minimum-variance frontier curve (both branches) ──
     full curve faint; efficient (upper) branch bright.              */
  const yLo = fp.y0 - 0.085, yHi = 0.30;
  // lower (inefficient) branch — faint
  ctx.beginPath();
  for (let y=fp.y0, first=true; y>=yLo; y-=0.0025) {
    const [x,sy]=toScreen(sigmaOf(y), y); first?(ctx.moveTo(x,sy),first=false):ctx.lineTo(x,sy);
  }
  ctx.strokeStyle='rgba(90,120,150,0.40)'; ctx.lineWidth=1.4; ctx.stroke();
  // upper (efficient) branch — bright gradient
  ctx.beginPath();
  for (let y=fp.y0, first=true; y<=yHi; y+=0.0025) {
    const [x,sy]=toScreen(sigmaOf(y), y); first?(ctx.moveTo(x,sy),first=false):ctx.lineTo(x,sy);
  }
  const lG=ctx.createLinearGradient(0,p.t+ph,0,p.t);
  lG.addColorStop(0,'rgba(0,168,255,0.55)'); lG.addColorStop(1,'rgba(0,212,170,0.95)');
  ctx.strokeStyle=lG; ctx.lineWidth=2.4; ctx.stroke();

  /* ── Best-possible CAL: from (0, RF) through the tangency point ── */
  const slope = (tan.ret-RF)/tan.r;
  const calRetEnd = Math.min(RET_MAX-0.004, RF + slope*RISK_MAX);
  const calREnd   = (calRetEnd-RF)/slope;
  const [rf0x,rf0y]=toScreen(0,RF);
  const [calx,caly]=toScreen(calREnd,calRetEnd);
  ctx.beginPath(); ctx.moveTo(rf0x,rf0y); ctx.lineTo(calx,caly);
  ctx.strokeStyle='rgba(210,225,235,0.85)'; ctx.lineWidth=1.6; ctx.stroke();

  /* ── individual assets (real tickers) ── */
  if (++rebalTimer>=170) { doRebalance(); rebalTimer=0; }
  if (flashOpacity>0) { flashOpacity=Math.max(0,flashOpacity-0.02); document.getElementById('rebal-flash').style.opacity=flashOpacity; }

  ctx.font='bold 10.5px -apple-system,BlinkMacSystemFont,sans-serif';
  assets.forEach(a=>{
    a.r+=a.dr;     if(a.r<0.10||a.r>0.32)  a.dr*=-1;
    a.ret+=a.dret; if(a.ret<0.06||a.ret>0.27) a.dret*=-1;
    // keep each asset to the right of the frontier (assets can't beat it)
    const minR = sigmaOf(a.ret) + 0.012;
    if (a.r < minR) a.r = minR;
    if (a._fadingOut) { a.alpha-=0.05; if(a.alpha<=0&&a._next){ Object.assign(a,a._next); delete a._next; } }
    else if (a.alpha<1) a.alpha=Math.min(1,a.alpha+0.04);

    const [x,y]=toScreen(a.r,a.ret);
    const al=Math.max(0,Math.min(1,a.alpha));
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(196,160,40,${al})`;          // gold individual-asset dots
    ctx.fill();
    ctx.lineWidth=0.8; ctx.strokeStyle=`rgba(150,120,30,${al})`; ctx.stroke();
    ctx.fillStyle=`rgba(150,170,195,${al*0.85})`;
    ctx.textAlign='left'; ctx.fillText(a.t, x+7, y+3.5);
  });

  /* ── tangency portfolio marker (red) ── */
  const [tx,ty]=toScreen(tan.r,tan.ret);
  const pulse=1+Math.sin(t*0.07)*0.18;
  ctx.beginPath(); ctx.arc(tx,ty,10*pulse,0,Math.PI*2); ctx.strokeStyle='rgba(229,57,53,0.22)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,ty,5.5,0,Math.PI*2); ctx.fillStyle='#e53935'; ctx.fill();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,180,175,0.9)'; ctx.stroke();

  /* ── risk-free marker on the y-axis ── */
  ctx.beginPath(); ctx.arc(rf0x,rf0y,3,0,Math.PI*2); ctx.fillStyle='rgba(210,225,235,0.9)'; ctx.fill();

  /* ── annotations (academic labels) ── */
  ctx.fillStyle='rgba(0,212,170,0.95)'; ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='left';
  const [efx,efy]=toScreen(sigmaOf(0.275),0.275);
  ctx.fillText('Efficient Frontier', efx+10, efy+2);

  ctx.fillStyle='rgba(229,57,53,0.95)'; ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='right';
  ctx.fillText('Tangency Portfolio', tx-12, ty-8);

  ctx.fillStyle='rgba(170,150,90,0.85)'; ctx.font='12px -apple-system,sans-serif'; ctx.textAlign='center';
  ctx.fillText('Individual Assets', toScreen(0.26,0.10)[0], toScreen(0.26,0.10)[1]);

  ctx.fillStyle='rgba(200,215,228,0.8)'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText('risk-free rate', p.l+6, rf0y-7);
  // "Best possible CAL" along the lower part of the line
  const [bcx,bcy]=toScreen(calREnd*0.42, RF+slope*calREnd*0.42);
  ctx.save(); ctx.translate(bcx, bcy+18); ctx.fillStyle='rgba(200,215,228,0.7)'; ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.fillText('Best possible CAL', 0, 0); ctx.restore();

  /* ── axes ── */
  ctx.strokeStyle='#1e2a35'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(p.l,p.t); ctx.lineTo(p.l,p.t+ph); ctx.lineTo(p.l+pw,p.t+ph); ctx.stroke();

  ctx.font='10px "SF Mono",monospace'; ctx.fillStyle='#2a3848'; ctx.textAlign='center';
  [0.06,0.12,0.18,0.24,0.30,0.36].forEach(r=>{ const [x]=toScreen(r,0); ctx.fillText((r*100).toFixed(0)+'%',x,p.t+ph+14); });
  ctx.textAlign='right';
  [0.05,0.10,0.15,0.20,0.25,0.30].forEach(ret=>{ const [,y]=toScreen(0,ret); ctx.fillText((ret*100).toFixed(0)+'%',p.l-6,y+3.5); });

  ctx.textAlign='center'; ctx.fillStyle='#3a4a5a'; ctx.font='11px -apple-system,sans-serif';
  ctx.fillText('Standard Deviation  σ (annualized)', p.l+pw/2, VH-8);
  ctx.save(); ctx.translate(15,p.t+ph/2); ctx.rotate(-Math.PI/2); ctx.fillText('Expected Return', 0, 0); ctx.restore();
  ctx.textAlign='left';

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
