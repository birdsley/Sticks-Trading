<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TGA — Mean Reversion Surface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060c08; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  canvas { display: block; }
  #hud { position: absolute; bottom: 12px; left: 14px; font-size: 11px; pointer-events: none; line-height: 1.8; }
  #regime-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px; }
  .leg { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
  .leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 14px; height: 2px; border-radius: 1px; background: #00ff80; flex-shrink: 0; }
  .leg-txt { color: #3e3e3e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="regime-label">—</div>
  <div class="leg"><div class="leg-dot" style="background:radial-gradient(circle at 35% 30%,#ff9090,#ff4757);"></div><span class="leg-txt">Mean reversion — pulled toward equilibrium</span></div>
  <div class="leg"><div class="leg-dot" style="background:radial-gradient(circle at 35% 30%,#90c8ff,#00a8ff);"></div><span class="leg-txt">Momentum — diverged, no pull-back</span></div>
  <div class="leg"><div class="leg-line"></div><span class="leg-txt">Strategy path through active signals</span></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const GX = 18, GY = 12;
const MARGIN  = 20;
const PIN_H   = 5.5;    // stem height above sphere in grid-z units
const N_DOTS  = 8;      // always 8 dots

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// ── Auto-fit dims — includes terrain + stems in vertical budget ──
function dims() {
  const w = canvas.width, h = canvas.height;
  const maxZ = 17 + PIN_H + 3;   // terrain max + stem + sphere offset
  const cwH  = (h - 2*MARGIN) / ((GX+GY)*0.46 + maxZ*0.52);
  const cwW  = w / (GX+GY+2);
  const cw   = Math.max(4, Math.floor(Math.min(cwH, cwW)));
  const ch   = Math.floor(cw*0.46);
  const cz   = cw*0.50;
  const oy   = canvas.height - MARGIN - (GX+GY)*ch;
  return { cw, ch, cz, ox: w*0.5, oy };
}
function iso(gx, gy, gz) {
  const { cw, ch, cz, ox, oy } = dims();
  return [ox+(gx-gy)*cw, oy+(gx+gy)*ch-gz*cz];
}

// ── Height field — fast, consistent speed (no shocks) ────────
let t = 0, blend = 0, regimePhase = 0, regimeTimer = 280;

function getH(gx, gy) {
  const nx = gx/GX, ny = gy/GY;

  const hMR =
    (Math.sin(nx*Math.PI*4.3 + t*0.022)*0.5+0.5)*3.8 +
    (Math.sin(ny*Math.PI*3.8 + t*0.019)*0.5+0.5)*3.4 +
    (Math.sin((nx+ny)*Math.PI*2.9 + t*0.025)*0.5+0.5)*2.8 +
    (Math.sin((nx*3.3+ny*2.2)*Math.PI + t*0.018)*0.5+0.5)*2.1 +
    (Math.sin((nx*1.7-ny*3.2)*Math.PI + t*0.028)*0.5+0.5)*1.9 + 2.0;

  const hMOM =
    (Math.sin(nx*Math.PI*1.15 + t*0.013)*0.5+0.5)*5.5 +
    (Math.cos((nx+ny*0.6)*Math.PI*0.92 + t*0.011)*0.5+0.5)*6.0 +
    (Math.sin(ny*Math.PI*0.72 + t*0.011)*0.5+0.5)*3.2 + 2.0;

  return hMR*(1-blend) + hMOM*blend;
}

function buildH() {
  const H = [];
  for (let gy=0; gy<=GY; gy++) {
    H[gy] = [];
    for (let gx=0; gx<=GX; gx++) H[gy][gx] = getH(gx, gy);
  }
  return H;
}

function tileColor(h) {
  const n = Math.min(1, Math.max(0, h/17));
  return [Math.floor(n*10), Math.floor(n*155+10), Math.floor(n*105+8)];
}

// ── Extrema detection ─────────────────────────────────────────
function findLocalExtrema(H) {
  const maxima=[], minima=[];
  for (let gy=1; gy<GY; gy++) {
    for (let gx=1; gx<GX; gx++) {
      const h = H[gy][gx];
      const ns = [H[gy-1][gx],H[gy+1][gx],H[gy][gx-1],H[gy][gx+1],
                  H[gy-1][gx-1],H[gy-1][gx+1],H[gy+1][gx-1],H[gy+1][gx+1]];
      if (h >= Math.max(...ns)-0.25) maxima.push({gx,gy,h});
      if (h <= Math.min(...ns)+0.25) minima.push({gx,gy,h});
    }
  }
  return { maxima, minima };
}

function pickWithSpacing(arr, N, existing=[]) {
  const shuffled = [...arr].sort(()=>Math.random()-0.5);
  const sel = [];
  const all = [...existing];
  for (const p of shuffled) {
    if (sel.length >= N) break;
    if (all.every(s => Math.abs(s.gx-p.gx)>2 || Math.abs(s.gy-p.gy)>2)) {
      sel.push(p); all.push(p);
    }
  }
  return sel;
}

// ── Markers: 8 total, slow refresh (one replacement every 90 frames) ──
let markers = [];
let markerTimer = 0;
const MARKER_INTERVAL = 28;  // replace one dot every ~0.5s → each dot lives ~4s

function initMarkers(H) {
  const { maxima, minima } = findLocalExtrema(H);
  const reds  = pickWithSpacing(maxima, 4);
  const blues = pickWithSpacing(minima, 4, reds);
  const all = [
    ...reds.map(p=>({...p, type:'max'})),
    ...blues.map(p=>({...p, type:'min'})),
  ];
  // Interleave: sort by gx so path traces left→right
  markers = all.sort((a,b)=>a.gx-b.gx);
}

function updateOneMarker(H) {
  if (markers.length === 0) { initMarkers(H); return; }
  if (++markerTimer < MARKER_INTERVAL) return;
  markerTimer = 0;

  const { maxima, minima } = findLocalExtrema(H);
  // Balance: ensure ~4 red, ~4 blue
  const nRed  = markers.filter(m=>m.type==='max').length;
  const nBlue = markers.filter(m=>m.type==='min').length;
  const addRed = nBlue > nRed || (nBlue===nRed && Math.random()<0.5);
  const pool   = addRed ? maxima : minima;

  // Replace one marker (random choice)
  const replaceIdx = Math.floor(Math.random()*markers.length);
  const remaining  = markers.filter((_,i)=>i!==replaceIdx);
  const candidate  = pickWithSpacing(pool, 1, remaining)[0];
  if (!candidate) return;

  markers[replaceIdx] = { ...candidate, type: addRed?'max':'min' };
  // Re-sort by gx so path stays ordered left→right
  markers.sort((a,b)=>a.gx-b.gx);
}

// ── Sphere helper ─────────────────────────────────────────────
function sphere(x, y, r, hex, hi) {
  const glow = ctx.createRadialGradient(x,y,0,x,y,r*2.3);
  glow.addColorStop(0, hex+'55'); glow.addColorStop(1, hex+'00');
  ctx.beginPath(); ctx.arc(x,y,r*2.3,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
  const sg = ctx.createRadialGradient(x-r*.36,y-r*.36,r*.05,x+r*.09,y+r*.09,r);
  sg.addColorStop(0, hi); sg.addColorStop(.38, hex+'ee'); sg.addColorStop(1, hex+'77');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
}

// ── Regime + shock ────────────────────────────────────────────
const REGIME_NAMES  = ['MEAN REVERSION DOMINANT','REGIME TRANSITION ↓','MOMENTUM DOMINANT','REGIME TRANSITION ↑'];
const REGIME_COLORS = ['#00d4aa','#ff9f43','#00a8ff','#ff9f43'];

function updateRegime() {
  if (--regimeTimer<=0) {
    regimePhase=(regimePhase+1)%4;
    regimeTimer=(regimePhase===1||regimePhase===3)?80:260;
  }
  blend += ((regimePhase>=2?1:0)-blend)*0.013;
}

// ── Render ────────────────────────────────────────────────────
function frame() {
  t++;
  updateRegime();
  const H = buildH();
  updateOneMarker(H);

  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#060c08'; ctx.fillRect(0,0,w,h);

  // Terrain — diagonal sweep back→front
  for (let d=0; d<=GX+GY-2; d++) {
    for (let gx=0; gx<=d&&gx<GX; gx++) {
      const gy=d-gx; if(gy<0||gy>=GY) continue;
      const h00=H[gy][gx],h10=H[gy][gx+1],h01=H[gy+1][gx],h11=H[gy+1][gx+1];
      const avg=(h00+h10+h01+h11)/4;
      const [x00,y00]=iso(gx,gy,h00),  [x10,y10]=iso(gx+1,gy,h10);
      const [x11,y11]=iso(gx+1,gy+1,h11), [x01,y01]=iso(gx,gy+1,h01);
      const [r,g,b]=tileColor(avg);
      ctx.beginPath(); ctx.moveTo(x00,y00); ctx.lineTo(x10,y10); ctx.lineTo(x11,y11); ctx.lineTo(x01,y01); ctx.closePath();
      ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fill();
      ctx.strokeStyle=`rgba(0,${Math.floor(g*.55+28)},${Math.floor(b*.4+15)},0.45)`;
      ctx.lineWidth=0.5; ctx.stroke();
    }
  }

  if (markers.length > 0) {
    // ── 1. Dotted stems — defined, bright, from sphere upward ──
    markers.forEach(m => {
      const mh = H[Math.min(GY,m.gy)][Math.min(GX,m.gx)];
      const baseZ = mh + 2.5;
      const tipZ  = baseZ + PIN_H;
      const [bx,by] = iso(m.gx+.5, m.gy+.5, baseZ);
      const [tx,ty] = iso(m.gx+.5, m.gy+.5, tipZ);
      const col    = m.type==='max' ? '#ff4757' : '#00a8ff';

      // Outer glow on stem
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur  = 4;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(tx,ty);
      ctx.strokeStyle = col+'cc'; ctx.lineWidth = 2.2;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();

      // Tip cap
      ctx.beginPath(); ctx.arc(tx,ty,2.5,0,Math.PI*2);
      ctx.fillStyle = col+'bb'; ctx.fill();
    });

    // ── 2. Green path — connects spheres in left→right order ──
    ctx.save();
    ctx.shadowColor = '#00ff80'; ctx.shadowBlur = 6;
    ctx.beginPath();
    markers.forEach((m,i) => {
      const mh = H[Math.min(GY,m.gy)][Math.min(GX,m.gx)];
      const [x,y] = iso(m.gx+.5, m.gy+.5, mh+2.8);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.strokeStyle='#00ff80'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
    ctx.restore();

    // ── 3. Spheres — drawn on top ─────────────────────────────
    markers.forEach(m => {
      const mh = H[Math.min(GY,m.gy)][Math.min(GX,m.gx)];
      const [x,y] = iso(m.gx+.5, m.gy+.5, mh+2.5);
      if (m.type==='max') sphere(x,y,7,'#ff4757','#ffaaaa');
      else                sphere(x,y,7,'#00a8ff','#aadfff');
    });

    // Path head dot on latest-added marker
    const last = markers[markers.length-1];
    const lh   = H[Math.min(GY,last.gy)][Math.min(GX,last.gx)];
    const [lx,ly] = iso(last.gx+.5, last.gy+.5, lh+2.8);
    ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2); ctx.fillStyle='#00ff80'; ctx.fill();
    ctx.beginPath(); ctx.arc(lx,ly,8,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,255,128,0.3)'; ctx.lineWidth=2; ctx.stroke();
  }

  // HUD
  const el = document.getElementById('regime-label');
  el.style.color = REGIME_COLORS[regimePhase];
  el.textContent = REGIME_NAMES[regimePhase];

  requestAnimationFrame(frame);
}

// Seed markers on first valid height field
const H0 = buildH();
initMarkers(H0);
frame();
</script>
</body>
</html>
