<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TGA — Mean Reversion Surface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060c08; overflow: hidden; font-family: 'SF Mono','JetBrains Mono','Menlo',monospace; }
  canvas { display: block; }
  #hud { position: absolute; bottom: 12px; left: 14px; font-size: 11px; pointer-events: none; line-height: 1.8; }
  #regime-label { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; margin-bottom: 6px; font-family: 'SF Mono','JetBrains Mono',monospace; }
  .leg { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
  .leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 14px; height: 2px; border-radius: 1px; background: #00ff80; flex-shrink: 0; }
  .leg-txt { color: #767b85; }
  /* ── Terminal telemetry block ───────────────────────────── */
  #tele {
    position: absolute; bottom: 12px; left: 14px;
    border: 1px solid #1A261F; background: rgba(8,15,11,0.72);
    padding: 9px 12px 8px; min-width: 232px;
    font-family: 'SF Mono','JetBrains Mono','Menlo',monospace;
    pointer-events: none; backdrop-filter: blur(2px);
  }
  #tele #regime-label { margin-bottom: 7px; }
  .tl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
            font-size: 10px; line-height: 1.9; }
  .tl-k { color: #5a6b60; letter-spacing: 0.4px; text-transform: uppercase; }
  .tl-v { color: #cfe8d8; font-variant-numeric: tabular-nums; }
  .tl-sep { height: 1px; background: #1A261F; margin: 6px 0; }
  .tl-bar { width: 64px; height: 4px; background: #111A14; border: 1px solid #1A261F; position: relative; }
  .tl-bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: #00ff80; }
  .leg { margin-bottom: 0; }
  .leg-txt { font-size: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tele">
  <div id="regime-label">—</div>
  <div class="tl-row"><span class="tl-k">ADX Regime Strength</span><span class="tl-v" id="t-adx">—</span></div>
  <div class="tl-row"><span class="tl-k">Micro-Vol Variance σ²</span><span class="tl-v" id="t-var">—</span></div>
  <div class="tl-row"><span class="tl-k">Active Arb Clusters</span><span class="tl-v" id="t-clu">—</span></div>
  <div class="tl-row"><span class="tl-k">Max |z| Dislocation</span><span class="tl-v" id="t-z">—</span></div>
  <div class="tl-row"><span class="tl-k">Mode Blend</span><span class="tl-v"><span class="tl-bar"><i id="t-blendbar"></i></span></span></div>
  <div class="tl-sep"></div>
  <div class="leg"><div class="leg-dot" style="background:linear-gradient(135deg,#ff7a85,#ff2d3f);"></div><span class="leg-txt">Overbought — pulled toward fair value</span></div>
  <div class="leg"><div class="leg-dot" style="background:linear-gradient(135deg,#7ec4ff,#0090ff);"></div><span class="leg-txt">Oversold — diverged, trending</span></div>
  <div class="leg"><div class="leg-line"></div><span class="leg-txt">Cross-sectional arbitrage routing</span></div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   TGA — Stochastic Market Surface
   fBm value-noise terrain · regime interpolation · extrema/gradient
   markers · depth-faded retina grid · terminal telemetry HUD
   ══════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const GX = 18, GY = 12;       // grid cells (x, y)
const MARGIN  = 20;
const SHIFT   = 38;           // lift terrain up in frame
const PIN_H   = 5.5;          // stem reach in grid-z units
const ZMAX    = 17;           // nominal terrain ceiling (grid-z units)

/* ── High-DPI / Retina backing ──────────────────────────────────────
   Back the canvas with devicePixelRatio so 1px grid lines stay razor
   sharp on 2K/4K. All draw math stays in CSS pixels; the context is
   scaled once per resize.                                            */
let DPR = Math.max(1, window.devicePixelRatio || 1);
let VW = 0, VH = 0;           // logical (CSS) viewport in px
function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  VW  = window.innerWidth;
  VH  = window.innerHeight;
  canvas.width  = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width  = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // 1 unit = 1 CSS px
}
resize();
window.addEventListener('resize', resize);

/* ── Isometric projection (auto-fit to viewport) ──────────────────── */
function dims() {
  const w = VW, h = VH;
  const maxZ = ZMAX + PIN_H + 3;
  const cwH  = (h - 2 * MARGIN) / ((GX + GY) * 0.46 + maxZ * 0.52);
  const cwW  = w / (GX + GY + 2);
  const cw   = Math.max(4, Math.floor(Math.min(cwH, cwW)));
  const ch   = Math.floor(cw * 0.46);
  const cz   = cw * 0.50;
  const oy   = h - MARGIN - (GX + GY) * ch - SHIFT;
  return { cw, ch, cz, ox: w * 0.5, oy };
}
let D = dims();
function iso(gx, gy, gz) {
  return [D.ox + (gx - gy) * D.cw, D.oy + (gx + gy) * D.ch - gz * D.cz];
}

/* ── Value-noise + fBm ──────────────────────────────────────────────
   Cheap hash-based value noise with smoothstep interpolation; fBm
   stacks octaves for fractal structure. Deterministic, GC-free.     */
function hash(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);                 // 0..1
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi,        yf = y - yi;
  const u  = xf * xf * (3 - 2 * xf);        // smoothstep
  const v  = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi),     b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v)
       + c * (1 - u) * v       + d * u * v;  // 0..1
}
function fbm(x, y, oct) {
  let amp = 0.5, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum  += amp * vnoise(x * freq, y * freq);
    norm += amp;
    freq *= 2.0; amp *= 0.5;
  }
  return sum / norm;                        // 0..1
}

/* ── Regime engine ──────────────────────────────────────────────────
   blend 0 → mean-reversion (choppy, high-entropy)
   blend 1 → momentum (clean directional wavefronts)                 */
let t = 0;                    // normalized frame clock (60fps units)
let blend = 0;                // smoothed regime mixer 0..1
let regimePhase = 0;          // 0 MR · 1 trans↓ · 2 MOM · 3 trans↑
let regimeTimer = 280;

/* Stochastic market surface height at grid node (gx, gy). */
function getH(gx, gy) {
  const nx = gx / GX, ny = gy / GY;

  /* MEAN REVERSION — choppy localized sea of micro-peaks/troughs.
     High-frequency fBm (macro structure) + an "alpha" micro-noise
     layer: high-frequency, low-amplitude systemic market noise.     */
  const macroMR = fbm(nx * 4.6 + 11.0, ny * 4.2 + t * 0.010 + 7.0, 5);
  const alpha   = (vnoise(gx * 1.55 + t * 0.06, gy * 1.55 - t * 0.04) - 0.5);
  const hMR     = macroMR * 13.5 + alpha * 2.4 + 2.0;

  /* MOMENTUM — elongated directional wavefronts sliding across plane.
     Sample low-frequency fBm along a primary axis that translates in
     time → clean macro-slopes, little cross-axis structure.          */
  const u       = nx * 0.92 + ny * 0.34;    // primary trend axis
  const cross   = (ny - nx) * 0.18;         // gentle cross-tilt
  const hMOM    = fbm(u * 1.45 - t * 0.011 + 3.0, cross + 5.0, 3) * 13.0
                + (u * 4.2) + 1.5;          // persistent directional ramp

  return hMR * (1 - blend) + hMOM * blend;
}

/* ── Height-field cache (rebuilt each frame) ────────────────────── */
const H = [];
for (let gy = 0; gy <= GY; gy++) H[gy] = new Float64Array(GX + 1);
let meanH = 0;                // structural "fair value" plane
function buildH() {
  let sum = 0, count = 0;
  for (let gy = 0; gy <= GY; gy++) {
    for (let gx = 0; gx <= GX; gx++) {
      const v = getH(gx, gy);
      H[gy][gx] = v; sum += v; count++;
    }
  }
  meanH = sum / count;
}

/* ── Tile shading: dark slate base, faint height-driven green tint ── */
function tileColor(h, shade) {
  const n = Math.min(1, Math.max(0, h / ZMAX));
  const r = Math.floor((6  + n * 10) * shade);
  const g = Math.floor((16 + n * 120) * shade);
  const b = Math.floor((12 + n * 70)  * shade);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ── Feature detection — extrema (MR) & steepest gradient (MOM) ───── */
function detectFeatures() {
  const maxima = [], minima = [], steep = [];
  for (let gy = 1; gy < GY; gy++) {
    for (let gx = 1; gx < GX; gx++) {
      const h = H[gy][gx];
      const l = H[gy][gx - 1], r = H[gy][gx + 1];
      const u = H[gy - 1][gx], d = H[gy + 1][gx];
      const ns = [u, d, l, r,
                  H[gy - 1][gx - 1], H[gy - 1][gx + 1],
                  H[gy + 1][gx - 1], H[gy + 1][gx + 1]];
      if (h >= Math.max.apply(null, ns) - 0.25) maxima.push({ gx, gy, h });
      if (h <= Math.min.apply(null, ns) + 0.25) minima.push({ gx, gy, h });
      const dx = (r - l) * 0.5, dy = (d - u) * 0.5;
      const grad = Math.sqrt(dx * dx + dy * dy);
      steep.push({ gx, gy, h, grad, up: dx + dy >= 0 });
    }
  }
  steep.sort((a, b) => b.grad - a.grad);
  return { maxima, minima, steep };
}

/* Greedy spatial spacing so markers never clump. */
function pickWithSpacing(arr, N, existing) {
  const sel = [], all = existing ? existing.slice() : [];
  for (let i = 0; i < arr.length && sel.length < N; i++) {
    const p = arr[i];
    let ok = true;
    for (let j = 0; j < all.length; j++) {
      if (Math.abs(all[j].gx - p.gx) <= 2 && Math.abs(all[j].gy - p.gy) <= 2) { ok = false; break; }
    }
    if (ok) { sel.push(p); all.push(p); }
  }
  return sel;
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ── Marker system — 8 contextual signals, slow rotation ─────────── */
const N_DOTS = 8;
let markers = [];
let markerTimer = 0;
const MARKER_INTERVAL = 28;

/* Source the marker pool from the live regime:
   MR-dominant → true extrema (overbought / oversold)
   MOM-dominant → cells of maximum gradient (trend velocity)         */
function seedMarkers(feat) {
  if (blend < 0.5) {
    const reds  = pickWithSpacing(shuffled(feat.maxima), 4)
                    .map(p => ({ gx: p.gx, gy: p.gy, type: 'max' }));
    const blues = pickWithSpacing(shuffled(feat.minima), 4, reds)
                    .map(p => ({ gx: p.gx, gy: p.gy, type: 'min' }));
    markers = reds.concat(blues);
  } else {
    markers = pickWithSpacing(feat.steep, N_DOTS)
                .map(p => ({ gx: p.gx, gy: p.gy, type: p.up ? 'max' : 'min' }));
  }
  markers.sort((a, b) => a.gx - b.gx);      // left → right routing
}

function updateMarkers(feat) {
  if (markers.length === 0) { seedMarkers(feat); return; }
  if (++markerTimer < MARKER_INTERVAL) return;
  markerTimer = 0;

  const replaceIdx = (Math.random() * markers.length) | 0;
  const remaining  = markers.filter((_, i) => i !== replaceIdx);

  let cand;
  if (blend < 0.5) {
    const nRed = markers.filter(m => m.type === 'max').length;
    const wantRed = nRed < 4 || (nRed === 4 && Math.random() < 0.5);
    const pool = shuffled(wantRed ? feat.maxima : feat.minima);
    cand = pickWithSpacing(pool, 1, remaining)[0];
    if (cand) cand = { gx: cand.gx, gy: cand.gy, type: wantRed ? 'max' : 'min' };
  } else {
    const c = pickWithSpacing(feat.steep, 1, remaining)[0];
    if (c) cand = { gx: c.gx, gy: c.gy, type: c.up ? 'max' : 'min' };
  }
  if (!cand) return;
  markers[replaceIdx] = cand;
  markers.sort((a, b) => a.gx - b.gx);
}

/* ── Sphere: sharp linear-gradient render (no plastic specular) ──── */
function sphere(x, y, r, lo, hi, glowHex) {
  // soft systemic glow
  const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
  glow.addColorStop(0, glowHex + '40');
  glow.addColorStop(1, glowHex + '00');
  ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
  ctx.fillStyle = glow; ctx.fill();
  // crisp linear gradient body
  const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  g.addColorStop(0, hi);
  g.addColorStop(1, lo);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = lo;
  ctx.stroke();
}

/* ── Regime state machine + smooth blend ────────────────────────── */
const REGIME_NAMES  = ['MEAN REVERSION DOMINANT', 'REGIME TRANSITION ↓',
                       'MOMENTUM DOMINANT', 'REGIME TRANSITION ↑'];
const REGIME_COLORS = ['#00d4aa', '#ff9f43', '#0090ff', '#ff9f43'];
function updateRegime() {
  if (--regimeTimer <= 0) {
    regimePhase = (regimePhase + 1) % 4;
    regimeTimer = (regimePhase === 1 || regimePhase === 3) ? 80 : 260;
  }
  const target = regimePhase >= 2 ? 1 : 0;
  blend += (target - blend) * 0.013;
}

/* ── Telemetry ──────────────────────────────────────────────────── */
const elRegime = document.getElementById('regime-label');
const elAdx = document.getElementById('t-adx');
const elVar = document.getElementById('t-var');
const elClu = document.getElementById('t-clu');
const elZ   = document.getElementById('t-z');
const elBlendBar = document.getElementById('t-blendbar');
let teleTimer = 0;
function updateTelemetry(feat) {
  if (++teleTimer < 6) return;              // throttle DOM writes
  teleTimer = 0;
  // micro-vol variance of the residual field about fair value
  let s2 = 0, n = 0, maxAbs = 0;
  for (let gy = 0; gy <= GY; gy++)
    for (let gx = 0; gx <= GX; gx++) {
      const d = H[gy][gx] - meanH; s2 += d * d; n++;
      if (Math.abs(d) > maxAbs) maxAbs = Math.abs(d);
    }
  const variance = s2 / n;
  const sigma = Math.sqrt(variance) || 1e-6;
  const zMax = maxAbs / sigma;
  // ADX-style trend strength: rises with momentum blend & gradient coherence
  const meanGrad = feat.steep.reduce((a, p) => a + p.grad, 0) / Math.max(1, feat.steep.length);
  const adx = 12 + blend * 46 + meanGrad * 3.0;

  elRegime.style.color = REGIME_COLORS[regimePhase];
  elRegime.textContent = REGIME_NAMES[regimePhase];
  elAdx.textContent = adx.toFixed(1);
  elAdx.style.color = adx > 40 ? '#0090ff' : adx > 25 ? '#ff9f43' : '#00d4aa';
  elVar.textContent = variance.toFixed(2);
  elClu.textContent = markers.length + ' / ' + (feat.maxima.length + feat.minima.length);
  elZ.textContent = zMax.toFixed(2) + 'σ';
  elBlendBar.style.width = (blend * 100).toFixed(0) + '%';
}

/* ── Frame ──────────────────────────────────────────────────────── */
let lastTs = performance.now();
function frame(ts) {
  // Decouple sim speed from refresh rate → identical motion at 60/120Hz
  const dt = Math.min(2.5, (ts - lastTs) / 16.667);
  lastTs = ts;
  t += dt;

  D = dims();
  updateRegime();
  buildH();
  const feat = detectFeatures();
  updateMarkers(feat);

  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = '#060c08'; ctx.fillRect(0, 0, VW, VH);

  /* ── Terrain — back-to-front diagonal sweep with depth fade ──────
     Depth buffer: background tiles (small gx+gy, high on screen) get
     lower opacity than foreground tiles → true field-depth.         */
  const maxD = GX + GY - 2;
  for (let dgl = 0; dgl <= maxD; dgl++) {
    const depth = dgl / maxD;               // 0 far → 1 near
    const shade = 0.45 + depth * 0.55;      // foreground brighter
    const lineA = 0.10 + depth * 0.42;      // foreground grid crisper
    for (let gx = 0; gx <= dgl && gx < GX; gx++) {
      const gy = dgl - gx; if (gy < 0 || gy >= GY) continue;
      const h00 = H[gy][gx],     h10 = H[gy][gx + 1];
      const h01 = H[gy + 1][gx], h11 = H[gy + 1][gx + 1];
      const avg = (h00 + h10 + h01 + h11) * 0.25;
      const p00 = iso(gx, gy, h00),         p10 = iso(gx + 1, gy, h10);
      const p11 = iso(gx + 1, gy + 1, h11), p01 = iso(gx, gy + 1, h01);
      ctx.beginPath();
      ctx.moveTo(p00[0], p00[1]); ctx.lineTo(p10[0], p10[1]);
      ctx.lineTo(p11[0], p11[1]); ctx.lineTo(p01[0], p01[1]); ctx.closePath();
      ctx.fillStyle = tileColor(avg, shade); ctx.fill();
      // slate grid line #15221B faded by depth
      ctx.strokeStyle = 'rgba(21,34,27,' + lineA.toFixed(3) + ')';
      ctx.lineWidth = 1; ctx.stroke();
    }
  }

  if (markers.length > 0) {
    /* ── Stems — dashed technical anchors to the fair-value plane ── */
    for (let i = 0; i < markers.length; i++) {
      const m = markers[i];
      const mh = H[m.gy][m.gx];
      const col = m.type === 'max' ? '#ff2d3f' : '#0090ff';
      const top = iso(m.gx + 0.5, m.gy + 0.5, mh + 2.4);
      const base = iso(m.gx + 0.5, m.gy + 0.5, meanH); // 0-mean structural plane
      ctx.save();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = col + 'aa'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(base[0], base[1]); ctx.stroke();
      ctx.restore();
      // anchor tick on the fair-value plane
      ctx.beginPath(); ctx.arc(base[0], base[1], 1.6, 0, Math.PI * 2);
      ctx.fillStyle = col + '88'; ctx.fill();
    }

    /* ── Arbitrage routing line — 1px glowing #00FF80 trace ──────── */
    ctx.save();
    ctx.shadowColor = '#00ff80'; ctx.shadowBlur = 5;
    ctx.beginPath();
    for (let i = 0; i < markers.length; i++) {
      const m = markers[i]; const mh = H[m.gy][m.gx];
      const p = iso(m.gx + 0.5, m.gy + 0.5, mh + 2.6);
      i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]);
    }
    ctx.strokeStyle = '#00ff80'; ctx.lineWidth = 1; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.restore();

    /* ── Spheres — sharp linear gradients ────────────────────────── */
    for (let i = 0; i < markers.length; i++) {
      const m = markers[i]; const mh = H[m.gy][m.gx];
      const p = iso(m.gx + 0.5, m.gy + 0.5, mh + 2.4);
      if (m.type === 'max') sphere(p[0], p[1], 6, '#b3001a', '#ff8a93', '#ff2d3f');
      else                  sphere(p[0], p[1], 6, '#003c6b', '#7ec4ff', '#0090ff');
    }

    /* ── Routing head — pulse on the last (right-most) node ───────── */
    const last = markers[markers.length - 1];
    const lh = H[last.gy][last.gx];
    const lp = iso(last.gx + 0.5, last.gy + 0.5, lh + 2.6);
    ctx.beginPath(); ctx.arc(lp[0], lp[1], 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff80'; ctx.fill();
    const pulse = 6 + Math.sin(t * 0.12) * 2;
    ctx.beginPath(); ctx.arc(lp[0], lp[1], pulse, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,255,128,0.28)'; ctx.lineWidth = 1; ctx.stroke();
  }

  updateTelemetry(feat);
  requestAnimationFrame(frame);
}

/* seed & launch */
buildH();
seedMarkers(detectFeatures());
requestAnimationFrame(frame);
</script>
</body>
</html>
