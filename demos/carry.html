function layout() {

const ZC = 6, DIST = 44;
function P(x, y, z) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const zz = z - ZC;
  const X = x * cy + zz * sy, Z1 = -x * sy + zz * cy;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const Y = y * cp + Z1 * sp, Z = -y * sp + Z1 * cp;
  const s = L.F / (DIST + Z);
  return { x: L.cx + X * s, y: L.cy - Y * s - 0, s, d: Z };

function speedAt(mi) {

}
function rowVals(k) { return D.r[Math.max(0, Math.min(NM - 1, k))]; }

// ── 3D scene ──

  const cells = [];

    const z = (k + fr) * ZSTEP;
    for (let j = 0; j < COLX.length; j++) {
      const v = k === 0 ? cur[j] + (nxt[j] - cur[j]) * fr : cur[j];

    const ty = h >= 0 ? yt : yb;
    const tp = [P(x0, ty, z0), P(x1, ty, z0), P(x1, ty, z1), P(x0, ty, z1)];
    poly(sd, rgb(shade(col, 0.55), alpha));
    poly(f, rgb(shade(col, 0.85), alpha));
    if (h >= 0) poly(tp, rgb(shade(col, 1.25), alpha));
    else poly([P(x0, 0, z0), P(x1, 0, z0), P(x1, 0, z1), P(x0, 0, z1)], rgb(shade(col, 1.2), alpha * 0.6));
    if (c.k === 0) {
      const g = P(c.x, h >= 0 ? yt : yb, z0);
      ctx.save(); ctx.shadowColor = rgb(col, 0.7); ctx.shadowBlur = 14; poly(f, rgb(shade(col, 0.9), 0.35)); ctx.restore();
    }
  });
  // front-row labels
  const cur = rowVals(mi), nxt = rowVals(mi + 1), wc = D.w[mi];
  COLX.forEach((x, j) => {
    const p = P(x, 0, -0.5);
    const fs = Math.max(7.5, Math.min(11.5, p.s * 0.40));
    if (!L.wide && fs < 8.5 && j % 2) return;
    ctx.save(); ctx.translate(p.x + 3, p.y - 2); ctx.rotate(-0.55);
    ctx.font = `600 ${fs}px ${SANS}`; ctx.textAlign = 'right';
    ctx.fillStyle = Math.abs(wc[j]) >= 0.5 ? C.txt : C.faint; ctx.fillText(D.t[j], 0, 0);
    ctx.restore();
    const v = cur[j] + (nxt[j] - cur[j]) * (T - mi);
    if (L.wide && Math.abs(wc[j]) >= 2) {
      const top = P(x, v * HSCALE + (v >= 0 ? 0.45 : -0.75), 0);
      ctx.font = `500 ${Math.max(7.5, Math.min(10, top.s * 0.33))}px ${MONO}`; ctx.textAlign = 'center';
      ctx.fillStyle = v > 0 ? rgb(C.long, 0.95) : rgb(C.short, 0.95);
      ctx.fillText(pct(wc[j], 0), top.x, top.y);
    }
  });
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

// ── HUD ──
function activeEvent(m) { for (const e of EVENTS) if (m >= e[0] && m <= e[1]) return e[2]; return null; }
function drawHeader() {
  const mi = Math.min(NM - 1, Math.floor(T)), m = D.m[mi];
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = `700 ${L.wide ? 22 : 18}px ${MONO}`; ctx.fillStyle = C.txt; ctx.fillText(fmtM(m), L.pad, 32);
  const ev = activeEvent(m);
  ctx.font = `500 ${L.wide ? 12.5 : 11}px ${SANS}`;
  if (ev) { ctx.fillStyle = C.warn; ctx.fillText(ev, L.pad, 52); }
  else { ctx.fillStyle = C.dim; ctx.fillText(L.wide ? 'Month-end positions of the live book, replayed from the backtest' : 'Real month-end positions', L.pad, 52); }
  // right: exposure + de-risk
  ctx.textAlign = 'right'; ctx.font = `500 10px ${MONO}`; ctx.fillStyle = C.dim;
  ctx.fillText(`GROSS ${Math.round(D.g[mi] * 100)}% OF NAV`, W - L.pad, 24);
  if (D.dr[mi] >= 0.5) {
    const txt = L.wide ? 'REGIME DE-RISK ON · EXPOSURE CUT' : 'DE-RISK ON';
    ctx.font = `700 9.5px ${MONO}`; const tw = ctx.measureText(txt).width + 14;
    const by = L.wide ? 32 : L.top.y - 26;
    rr(W - L.pad - tw, by, tw, 18, 4); ctx.fillStyle = 'rgba(242,169,59,0.14)'; ctx.fill(); ctx.strokeStyle = 'rgba(242,169,59,0.5)'; ctx.stroke();
    ctx.fillStyle = C.warn; ctx.textAlign = 'center'; ctx.fillText(txt, W - L.pad - tw / 2, by + 13);
  }
}
function drawTop() {
  const b = L.top, mi = Math.min(NM - 1, Math.floor(T));
  panel(b, 'LARGEST POSITIONS BY RISK');
  const r = D.r[mi], w = D.w[mi];
  const ix = r.map((v, j) => j).filter(j => Math.abs(r[j]) > 0.002).sort((a, c) => Math.abs(r[c]) - Math.abs(r[a]));
  const n = Math.max(1, Math.floor((b.h - 26) / 17)), y0 = b.y + 32;
  ix.slice(0, n).forEach((j, q) => {
    const y = y0 + q * 17, col = r[j] > 0 ? C.long : C.short;
    ctx.fillStyle = CLS[CLASS_OF[j]].col; ctx.fillRect(b.x + 10, y - 8, 3, 9);
    ctx.font = `600 11px ${SANS}`; ctx.fillStyle = C.txt; ctx.textAlign = 'left'; ctx.fillText(D.t[j], b.x + 18, y);
    const bx = b.x + 58, bw = b.w - 58 - 52, len = Math.min(bw, Math.abs(r[j]) / 0.3 * bw);
    rr(bx, y - 7, Math.max(2, len), 7, 2); ctx.fillStyle = rgb(col, 0.9); ctx.fill();
    ctx.font = `500 9.5px ${MONO}`; ctx.fillStyle = rgb(col, 1); ctx.textAlign = 'right'; ctx.fillText(pct(w[j], 1), b.x + b.w - 10, y);
  });
}
function drawEquity() {
  const b = L.eq, mi = Math.min(NM - 1, Math.floor(T));
  const bk = D.b[mi], sp = D.s[mi];
  panel(b, L.wide ? 'GROWTH OF $100 SINCE JAN 2007' : 'BOOK VS SPY');
  const x0 = b.x + 10, y0 = b.y + 24, w0 = b.w - 20 - (L.wide ? 64 : 40), h0 = b.h - 24 - 22;
  let lo = 60, hi = 0; for (let i = 0; i < NM; i++) { hi = Math.max(hi, D.b[i], D.s[i]); lo = Math.min(lo, D.b[i], D.s[i]); }
  const llo = Math.log(lo * 0.95), lhi = Math.log(hi * 1.05);
  const X = i => x0 + i / (NM - 1) * w0, Y = v => y0 + h0 - (Math.log(v) - llo) / (lhi - llo) * h0;
  const line = (a, to, col, lw, dash) => { ctx.beginPath(); for (let i = 0; i <= to; i++) i ? ctx.lineTo(X(i), Y(a[i])) : ctx.moveTo(X(i), Y(a[i])); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); };
  line(D.s, NM - 1, 'rgba(201,195,182,0.12)', 1); line(D.b, NM - 1, 'rgba(35,199,166,0.12)', 1);
  line(D.s, mi, 'rgba(201,195,182,0.75)', 1.3, [4, 3]); line(D.b, mi, C.book, 2);
  ctx.beginPath(); ctx.arc(X(mi), Y(bk), 3, 0, 7); ctx.fillStyle = C.book; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(X(mi), y0); ctx.lineTo(X(mi), y0 + h0); ctx.stroke();
  // drawdowns from peak so far
  let pb = 0, ps = 0; for (let i = 0; i <= mi; i++) { pb = Math.max(pb, D.b[i]); ps = Math.max(ps, D.s[i]); }
  const ddb = (bk / pb - 1) * 100, dds = (sp / ps - 1) * 100;
  ctx.font = `600 9.5px ${MONO}`; ctx.textAlign = 'left';
  let yb = Y(bk), ys = Y(sp); if (Math.abs(yb - ys) < 11) { if (yb < ys) { yb -= 5; ys += 5; } else { yb += 5; ys -= 5; } }
  const lx = x0 + w0 + 6;
  ctx.fillStyle = C.book; ctx.fillText((L.wide ? 'Book ' : '') + '$' + Math.round(bk), lx, yb + 3);
  ctx.fillStyle = C.spy; ctx.fillText((L.wide ? 'SPY ' : '') + '$' + Math.round(sp), lx, ys + 3);
  ctx.font = `500 9px ${MONO}`; ctx.textAlign = 'left'; ctx.fillStyle = C.faint;
  const dtx = L.wide ? `drawdown now · book ${pct(ddb, 0)} · SPY ${pct(dds, 0)}` : `dd ${pct(ddb, 0)} / ${pct(dds, 0)}`;
  ctx.fillText(dtx, x0, b.y + b.h - 8);
}
function drawFooter() {
  ctx.textBaseline = 'alphabetic'; ctx.font = `500 9.5px ${MONO}`; ctx.fillStyle = C.faint;
  const y = H - 10;
  ctx.textAlign = 'left';
  let x = L.pad;
  const item = (c, s) => { ctx.fillStyle = rgb(c, 1); ctx.fillRect(x, y - 7, 9, 8); x += 13; ctx.fillStyle = C.faint; ctx.fillText(s, x, y); x += ctx.measureText(s).width + 12; };
  item(C.long, 'long'); item(C.short, 'short');
  ctx.textAlign = 'right';
  ctx.fillText(L.wide ? 'bar height = share of the book’s risk · labels = % of NAV · real backtest positions' : 'real backtest positions', W - L.pad, y);
}

// ── loop ──
let last = performance.now();
function paint(now) {
  const tt = now / 1000;
  yaw = -0.16 + Math.sin(tt * 0.12) * 0.13;
  pitch = (L.wide ? 0.42 : 0.5) + Math.sin(tt * 0.09) * 0.04;
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 10, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#0b1220'); g.addColorStop(1, C.bg); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawScene(); drawHeader(); drawTop(); drawEquity(); drawFooter();
  if (hold > 2.6) { ctx.fillStyle = `rgba(5,8,13,${Math.min(1, (hold - 2.6) / 1.4)})`; ctx.fillRect(0, 0, W, H); }
}
function frame(now) {
  requestAnimationFrame(frame);   // queue the next frame first, so one bad frame can't stop the loop
  // the first rAF timestamp can be earlier than the performance.now() taken when the script ran;
  // a negative step pushed T below 0, paint() read month -1 and threw, and the loop died
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now;
  if (!document.hidden) {
    if (T < NM - 1) T = Math.max(0, Math.min(NM - 1, T + dt * speedAt(T)));
    else { hold += dt; if (hold > 4) { hold = 0; T = 0; } }
    paint(now);
  }
}
(function () { const q = new URLSearchParams(location.search).get('m'); const i = q ? D.m.indexOf(q) : -1; if (i >= 0) T = i; })();
resize(); paint(performance.now());   // first frame draws even in a hidden tab or a preview
requestAnimationFrame(frame);
</script>
